<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embodied Agent Lab</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #d1d5db;
            --accent: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        header h1 {
            margin: 0 0 4px;
            font-size: 22px;
        }

        header p {
            margin: 0;
            color: var(--muted);
        }

        main {
            display: grid;
            grid-template-columns: minmax(620px, 1fr) 360px;
            gap: 16px;
            padding: 16px;
        }

        canvas {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 32 / 22;
            background: #e5e7eb;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            border: 1px solid var(--line);
            background: #f9fafb;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        button:hover {
            filter: brightness(0.98);
        }

        .metric {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #eef2f7;
            font-size: 14px;
        }

        .metric:last-child {
            border-bottom: 0;
        }

        .metric strong {
            color: #111827;
        }

        .bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 4px;
        }

        .bar > span {
            display: block;
            height: 100%;
            background: var(--accent);
            width: 0;
        }

        .log {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            background: #0f172a;
            color: #d1d5db;
            border-radius: 12px;
            padding: 10px;
            height: 230px;
            overflow: auto;
            white-space: pre-wrap;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            margin-top: 10px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            margin-right: 6px;
            vertical-align: middle;
        }

        @media (max-width: 1000px) {
            main {
                grid-template-columns: 1fr;
            }

            canvas {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Embodied Agent Lab</h1>
        <p>Ein erster körperlicher Agent mit Weltmodell, Bedürfnissen, Emotionen, Zielen, Planung und Lernen.</p>
    </header>

    <main>
        <section>
            <canvas id="world" width="960" height="660"></canvas>
            <div class="legend">
                <div><span class="dot" style="background:#2563eb"></span>Roboter</div>
                <div><span class="dot" style="background:#22c55e"></span>Müll</div>
                <div><span class="dot" style="background:#f59e0b"></span>Ladestation / Basis</div>
                <div><span class="dot" style="background:#374151"></span>Hindernis</div>
                <div><span class="dot" style="background:#a855f7"></span>Mensch</div>
                <div><span class="dot" style="background:#ef4444"></span>Tier / Risiko</div>
            </div>
        </section>

        <aside class="panel">
            <div class="controls">
                <button id="startPause" class="primary">Start</button>
                <button id="step">Ein Schritt</button>
                <button id="reset">Reset</button>
            </div>

            <div class="metric">
                <strong>Speed</strong>
                <input id="speed" type="range" min="40" max="600" value="160" />
            </div>

            <div id="stats"></div>

            <h3>Gedanken / Log</h3>
            <div id="log" class="log"></div>
        </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
